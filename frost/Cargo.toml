[package]
name = "ob-frost"
version = "0.1.0"
edition = "2021"

[dependencies]
frost-secp256k1-tr = "2"
secp256k1 = { version = "0.29", features = ["rand", "std"] }
bitcoin = { version = "0.32", features = ["rand-std"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
