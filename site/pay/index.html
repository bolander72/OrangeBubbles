<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Bitcoin payment request — OrangeBubbles</title>
<style>
  :root { color-scheme: light dark; }
  * { margin:0; box-sizing:border-box; }
  body { font: 17px/1.5 -apple-system, system-ui, sans-serif;
         display:flex; min-height:100vh; align-items:center; justify-content:center;
         background:#fff; color:#111; padding:24px; }
  @media (prefers-color-scheme: dark) { body { background:#0d0d0f; color:#f2f2f2; } }
  .card { max-width:420px; width:100%; text-align:center; }
  .mark { width:72px; height:72px; border-radius:50%;
          background:linear-gradient(135deg,#f8941a,#e36b0d);
          display:flex; align-items:center; justify-content:center;
          font-size:38px; color:#fff; margin:0 auto 18px; font-weight:700; }
  h1 { font-size:22px; margin-bottom:6px; }
  .amount { font-size:34px; font-weight:800; margin:10px 0 2px;
            background:linear-gradient(135deg,#f8941a,#e36b0d);
            -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { opacity:.6; font-size:14px; margin-bottom:18px; }
  .addr { font-family:ui-monospace,monospace; font-size:13px; word-break:break-all;
          background:rgba(128,128,128,.12); border-radius:12px; padding:12px; margin:14px 0; }
  .btn { display:block; width:100%; padding:14px; border-radius:14px; border:0;
         font-size:17px; font-weight:600; cursor:pointer; text-decoration:none; margin-top:10px; }
  .primary { background:linear-gradient(135deg,#f8941a,#e36b0d); color:#fff; }
  .quiet { background:rgba(248,148,26,.14); color:#e36b0d; }
  .foot { margin-top:22px; font-size:12px; opacity:.5; }
  .err { opacity:.7; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="mark">₿</div>
  <h1>Bitcoin payment request</h1>
  <div id="content"><p class="err">This link is missing its payment details.</p></div>
  <p class="foot">Sent with OrangeBubbles — bitcoin inside iMessage.<br>
  Nothing on this page is transmitted anywhere; it renders entirely in your browser.</p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var address = q.get("address");
  if (!address || !/^[a-z0-9]{20,90}$/i.test(address)) return;
  var sats = parseInt(q.get("sats") || "0", 10);
  var label = (q.get("label") || "").slice(0, 64);
  var btc = sats > 0 ? (sats / 1e8).toFixed(8) : null;
  var uri = "bitcoin:" + address + (sats > 0 ? "?amount=" + btc : "");
  var el = document.getElementById("content");
  el.innerHTML =
    (sats > 0 ? '<div class="amount">' + sats.toLocaleString() + ' sats</div>' +
                '<div class="sub">' + btc + ' BTC' + (label ? " · " + label.replace(/[<>&]/g,"") : "") + '</div>'
              : '<div class="sub">Any amount' + (label ? " · " + label.replace(/[<>&]/g,"") : "") + '</div>') +
    '<div class="addr" id="addr">' + address + '</div>' +
    '<a class="btn primary" href="' + uri + '">Open in a bitcoin wallet</a>' +
    '<button class="btn quiet" id="copy">Copy address</button>';
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(address).then(function () {
      document.getElementById("copy").textContent = "Copied ✓";
    });
  };
})();
</script>
</body>
</html>
